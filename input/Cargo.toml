[package]
name = "rinflow-input"
description = "Input capture and emulation backends for the Linux agent: portals + libei, gamescope's EIS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rinflow-core.workspace = true
log.workspace = true
tokio.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["tokio", "input_capture", "remote_desktop", "screencast", "clipboard"] }
reis = { version = "0.7", features = ["tokio"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
libc = "0.2"
x11rb = { version = "0.14", default-features = false, features = ["xfixes", "xinput", "xtest", "randr", "dpms"] }
