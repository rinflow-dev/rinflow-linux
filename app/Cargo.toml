[package]
name = "rinflow"
description = "Rinflow's Linux window: devices, arrangement, pairing and settings"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rinflow"
path = "src/main.rs"

[dependencies]
rinflow-core.workspace = true
rinflow-shell.workspace = true
libc = "0.2"
log.workspace = true
serde.workspace = true
serde_json.workspace = true
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }

[build-dependencies]
glib-build-tools = "0.22"

# `cargo deb -p rinflow` from rinflow-linux/ after `cargo build --release`:
# one package with both binaries, the desktop files and the user service.
[package.metadata.deb]
name = "rinflow"
maintainer = "Rinflow <mmsann55@gmail.com>"
copyright = "2026 Rinflow"
extended-description = """Rinflow shares one mouse and keyboard between the computers on a desk: \
move the pointer off the edge of this screen and it appears on the Mac, \
Windows PC, Linux machine or Steam Deck next to it. This package holds the \
background agent and the settings window for Linux desktops (GNOME and KDE \
on Wayland, through the input portals)."""
section = "utils"
priority = "optional"
depends = "$auto, libadwaita-1-0 (>= 1.5)"
assets = [
    ["target/release/rinflow", "usr/bin/", "755"],
    ["target/release/rinflow-agent", "usr/bin/", "755"],
    ["../data/com.rinflow.linux.desktop", "usr/share/applications/", "644"],
    ["../data/com.rinflow.linux.metainfo.xml", "usr/share/metainfo/", "644"],
    ["../data/icons/com.rinflow.linux.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../data/icons/com.rinflow.linux-symbolic.svg", "usr/share/icons/hicolor/symbolic/apps/", "644"],
    ["../data/rinflow-agent.service", "usr/lib/systemd/user/", "644"],
    ["../target/locale/zh_CN/LC_MESSAGES/rinflow.mo", "usr/share/locale/zh_CN/LC_MESSAGES/", "644"],
]
