# yaml-language-server: $schema=https://raw.githubusercontent.com/flatpak/flatpak-builder/refs/heads/main/data/flatpak-manifest.schema.json
#
# Build from the workspace root (the directory holding rinflow-core and
# rinflow-linux side by side), so the path dependency resolves:
#
#   python3 flatpak-cargo-generator.py rinflow-linux/Cargo.lock -o rinflow-linux/build-aux/cargo-sources.json
#   flatpak-builder --user --install --force-clean build-dir rinflow-linux/build-aux/com.rinflow.rinflow.yml
app-id: com.rinflow.rinflow
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: rinflow
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  # The window finds the agent's socket in the runtime directory.
  - --filesystem=xdg-run/rinflow:create
  # A pairing request while no window is open
  # (agent/src/notify.rs).
  - --talk-name=org.freedesktop.Notifications
  # The tray icon (agent/src/tray.rs).
  - --talk-name=org.kde.StatusNotifierWatcher
  # Files copied on this device are read where they are, which needs more
  # than this: see the README ("Files"). Files copied on other devices
  # cannot be pasted from a sandbox (no FUSE).
  # Steam Deck Gaming Mode: gamescope's own EIS socket (see input/src/ei_discover.rs).
  - --filesystem=xdg-run/gamescope-0-ei
modules:
  - name: rinflow
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/rinflow/cargo
    build-commands:
      - cargo --offline fetch --manifest-path rinflow-linux/Cargo.toml --verbose
      - cargo --offline build --release --manifest-path rinflow-linux/Cargo.toml
      - install -Dm755 rinflow-linux/target/release/rinflow /app/bin/rinflow
      - install -Dm755 rinflow-linux/target/release/rinflow-agent /app/bin/rinflow-agent
      - install -Dm755 rinflow-linux/target/release/rinflowctl /app/bin/rinflowctl
      # The catalogs and the translated desktop entry and metainfo (msgfmt).
      - make -C rinflow-linux locale
      - install -Dm644 rinflow-linux/target/data/com.rinflow.rinflow.desktop /app/share/applications/com.rinflow.rinflow.desktop
      - install -Dm644 rinflow-linux/target/data/com.rinflow.rinflow.metainfo.xml /app/share/metainfo/com.rinflow.rinflow.metainfo.xml
      - install -Dm644 rinflow-linux/data/icons/com.rinflow.rinflow.svg /app/share/icons/hicolor/scalable/apps/com.rinflow.rinflow.svg
      - install -Dm644 rinflow-linux/data/icons/com.rinflow.rinflow-symbolic.svg /app/share/icons/hicolor/symbolic/apps/com.rinflow.rinflow-symbolic.svg
      - for lang in $(grep -v '^#' rinflow-linux/po/LINGUAS); do install -Dm644 rinflow-linux/target/locale/$lang/LC_MESSAGES/rinflow.mo /app/share/locale/$lang/LC_MESSAGES/rinflow.mo; done
    sources:
      - type: dir
        path: ../..
        skip:
          - rinflow-macos
          - rinflow-windows
          - linkcursor-android
          - rinflow-core/target
          - rinflow-linux/target
          - example
          - tmp
          - docs
      - cargo-sources.json
