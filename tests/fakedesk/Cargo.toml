[package]
name = "fakedesk"
description = "A stand-in desktop for tests: the InputCapture and RemoteDesktop portals on D-Bus and real EIS servers, driven over a control socket"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "fakedesk"
path = "src/main.rs"

[[bin]]
name = "injector"
path = "src/bin/injector.rs"

[dependencies]
rinflow-core.workspace = true
rinflow-input = { path = "../../input" }
log.workspace = true
serde.workspace = true
serde_json.workspace = true
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
reis = { version = "0.7" }
