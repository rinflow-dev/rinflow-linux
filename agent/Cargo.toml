[package]
name = "rinflow-agent"
description = "Rinflow's Linux agent: runs the core, captures and plays input, serves the window over a local socket"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rinflow-agent"
path = "src/main.rs"

# The command line: the same requests the window sends, from a terminal,
# a script or a desktop keyboard shortcut.
[[bin]]
name = "rinflowctl"
path = "src/bin/rinflowctl.rs"

[dependencies]
rinflow-core.workspace = true
rinflow-shell.workspace = true
rinflow-input = { path = "../input" }
log.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
libc = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
fuser = { version = "0.18", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
